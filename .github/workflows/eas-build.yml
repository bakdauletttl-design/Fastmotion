# Сборка мобильного приложения в облаке Expo (EAS) одной кнопкой:
# GitHub → Actions → "Mobile build" → Run workflow.
# Нужен секрет EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Mobile build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Платформа"
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: "Профиль из eas.json"
        type: choice
        options: [production, preview, development]
        default: production
      submit:
        description: "Сразу отправить в App Store Connect / Google Play"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Link project to expo.dev
        run: eas init --non-interactive --force
      - name: Build
        run: |
          EXTRA=""
          if [ "${{ inputs.submit }}" = "true" ]; then EXTRA="--auto-submit"; fi
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} \
            --non-interactive --no-wait $EXTRA
